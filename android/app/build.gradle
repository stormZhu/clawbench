plugins {
    id 'com.android.application'
    id 'jacoco'
}

/**
 * Auto-generate versionName when not provided via -PversionName.
 * Uses `git describe --tags --always` to match the format used by build.sh
 * for the Go backend, so APK and server versions are directly comparable.
 * Examples: v1.0.0, v0.30.0-30-g830bb6c, a0f87a96
 */
def autoVersionName() {
    if (project.hasProperty('versionName')) return project.property('versionName')
    try {
        def version = 'git describe --tags --always'.execute([], rootDir).text.trim()
        return version ?: "dev"
    } catch (Exception e) {
        return "dev"
    }
}

/**
 * Auto-generate versionCode when not provided via -PversionCode.
 * Uses `git rev-list --count HEAD` (total commit count) for a monotonically
 * increasing integer, matching the strategy used by build.sh and CI.
 */
def autoVersionCode() {
    if (project.hasProperty('versionCode')) return project.property('versionCode').toInteger()
    try {
        def code = 'git rev-list --count HEAD'.execute([], rootDir).text.trim()
        return code ? code.toInteger() : 1
    } catch (Exception e) {
        return 1
    }
}

/**
 * The NDK AGP should use for native symbol stripping.
 *
 * AGP runs its strip task only when it can resolve an NDK; without one, gomobile's
 * libgojni.so ships with its debug symbols and the APK ends up roughly twice as large.
 *
 * An explicit -PndkVersion wins, then an environment-provided NDK, then the newest one
 * installed under the SDK. Returns null when none is found, so a machine without an NDK
 * still builds — just larger.
 */
def resolveNdkVersion() {
    if (project.hasProperty('ndkVersion')) return project.property('ndkVersion')

    def fromEnv = System.getenv('ANDROID_NDK_HOME') ?: System.getenv('ANDROID_NDK_ROOT')
    if (fromEnv) return new File(fromEnv).name

    def sdkDir = null
    def localProps = rootProject.file('local.properties')
    if (localProps.exists()) {
        def props = new Properties()
        localProps.withInputStream { props.load(it) }
        sdkDir = props.getProperty('sdk.dir')
    }
    if (!sdkDir) sdkDir = System.getenv('ANDROID_HOME') ?: System.getenv('ANDROID_SDK_ROOT')
    if (!sdkDir) return null

    def ndkRoot = new File(sdkDir, 'ndk')
    if (!ndkRoot.isDirectory()) return null
    def names = (ndkRoot.listFiles() ?: []).findAll { it.isDirectory() }.collect { it.name }
    if (!names) return null
    // Directories are named "<major>.<minor>.<build>", so the lexicographic maximum is
    // the newest across the 2x/3x range. Install exactly one NDK (as CI does) and the
    // choice is unambiguous anyway.
    return names.max()
}

android {
    namespace 'com.clawbench.app'
    compileSdk 36

    def resolvedNdk = resolveNdkVersion()
    if (resolvedNdk) {
        ndkVersion resolvedNdk
    }

    defaultConfig {
        applicationId "com.clawbench.app"
        minSdk 24
        targetSdk 34
        versionCode autoVersionCode()
        versionName autoVersionName()

        ndk {
            // tailcatbridge is produced by gomobile for android/arm64 only.
            // Pinning the ABI keeps the APK honest: without this the other ABIs
            // would still advertise support and then crash with an
            // UnsatisfiedLinkError on the first Tailcat dial.
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        release {
            // CI: read from environment variables; Local: fallback to keystore file
            def keystoreFile = System.getenv("KEYSTORE_FILE")
            storeFile keystoreFile ? file(keystoreFile) : file('../clawbench.jks')
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: 'clawbench123'
            keyAlias System.getenv("KEY_ALIAS") ?: 'clawbench'
            keyPassword System.getenv("KEY_PASSWORD") ?: 'clawbench123'
        }
    }

    applicationVariants.all { variant ->
        // Debug: use different applicationId so it can coexist with release
        if (variant.buildType.name == "debug") {
            variant.outputs.all { output ->
                outputFileName = "clawbench-android-debug.apk"
            }
        }
        if (variant.buildType.name == "release") {
            variant.outputs.all { output ->
                outputFileName = "clawbench-android.apk"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
            debuggable true
            testCoverageEnabled true
            applicationIdSuffix ".debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
            all {
                jvmArgs '--add-opens', 'java.base/sun.misc=ALL-UNNAMED'
            }
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'com.github.mwiede:jsch:0.2.16'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.work:work-runtime:2.9.0'

    // gomobile-generated binding for the Tailcat transport (jni/arm64-v8a only).
    // The AAR carries its own consumer proguard rules (keeps go.** and
    // tailcatbridge.**), so the release build needs nothing extra here.
    implementation fileTree(dir: 'libs', include: ['*.aar'])

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.11.1'
    testImplementation 'org.mockito:mockito-core:5.8.0'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'androidx.test:core:1.5.0'
    testImplementation 'androidx.test.ext:junit:1.1.5'
    // Real org.json implementation for unit tests (android.jar stubs return defaults with returnDefaultValues=true)
    testImplementation 'org.json:json:20231013'
}

tasks.register('jacocoTestReport', JacocoReport) {
    dependsOn 'testDebugUnitTest'
    reports {
        xml.required = true
        html.required = true
    }
    def excludes = [
        '**/R.class', '**/R$*.class', '**/BuildConfig.*',
        '**/Manifest*.*'
    ]
    classDirectories.setFrom(files([
        fileTree(dir: "$buildDir/intermediates/javac/debug/classes",
                 excludes: excludes)
    ]))
    sourceDirectories.setFrom(files(['app/src/main/java']))
    executionData.setFrom(files(["$buildDir/outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec"]))
}
